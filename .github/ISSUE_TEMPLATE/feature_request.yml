name: Feature idea
description: Something you'd like Rigside to do
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: What would you like it to do, and what would you use it for?
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Sketches, another app that does something similar, or the screen you'd use it on.
